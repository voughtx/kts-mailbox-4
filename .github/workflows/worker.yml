name: KTS Register (worker)

on:
  repository_dispatch:
    types: [register]

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch runner
        run: |
          curl -sL -H "Authorization: token ${{ secrets.GH_PAT }}" \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/runner_register.py" \
            -o runner_register.py
      - name: Run worker
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HUB_REPO: voughtx/kts-mailbox
          RUNNER_ID: ${{ github.event.repository.name }}
          BATCH: "6"
        run: |
          python3 runner_register.py
